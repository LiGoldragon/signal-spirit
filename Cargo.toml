[package]
name         = "signal-spirit"
version      = "0.15.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-spirit"
description  = "Signal contract for the ordinary spirit surface."
publish      = false

[lib]
name = "signal_spirit"
path = "src/lib.rs"

[features]
default = ["dotos-text"]
dotos-text = ["dep:dotos", "signal-domain/dotos-text", "signal-frame/dotos-text"]

[dependencies]
signal-domain = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "4cb9cb704965489ea6c25f148bcd8c723c9a84c6", default-features = false }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "01676293a623d97b65e320d4138c4b480c6d5dad", default-features = false }
dotos = { git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "95aeb1470c549a404518faf1ab0280a36583a2b3" }
rkyv = { version = "=0.8.17", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[build-dependencies]
nomos-engine = { git = "https://github.com/LiGoldragon/nomos-engine.git", rev = "64a67c5b2465560e1b6db214d0c66d2258116856" }
spirit-ethos = { git = "https://github.com/LiGoldragon/spirit-ethos.git", rev = "cb7cdd6a8fedc2628c93e5f91259f74d3240da74" }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
